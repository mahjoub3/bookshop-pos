{% extends "base.html" %}
{% load shop_extras %}
{% block title %}Sales — {{ shop.shop_name }}{% endblock %}

{% block content %}
<div class="card p-4">
  <div class="flex flex-wrap items-center gap-2 mb-4">
    <h1 class="text-xl font-bold flex-1">Sales</h1>
    <input type="search" name="q" value="{{ request.GET.q }}" placeholder="Receipt # or customer…"
           class="input !w-64"
           hx-get="{% url 'sales:sale_list' %}" hx-trigger="keyup changed delay:300ms"
           hx-target="#table-wrap" hx-push-url="true">
    <select name="status" class="input !w-40"
            hx-get="{% url 'sales:sale_list' %}" hx-trigger="change"
            hx-target="#table-wrap" hx-push-url="true">
      <option value="">All statuses</option>
      <option value="paid" {% if request.GET.status == 'paid' %}selected{% endif %}>Paid</option>
      <option value="partial" {% if request.GET.status == 'partial' %}selected{% endif %}>Partial</option>
      <option value="credit" {% if request.GET.status == 'credit' %}selected{% endif %}>Credit</option>
    </select>
  </div>
  <div id="table-wrap">
    {% include "sales/partials/_sale_table.html" %}
  </div>
</div>
{% endblock %}
