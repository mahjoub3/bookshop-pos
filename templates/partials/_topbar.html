{# Top bar: sidebar toggle, shop name, user menu, dark mode #}
<header class="h-14 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 flex items-center gap-3 px-4">
  <button @click="sidebarOpen = !sidebarOpen"
          class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800" aria-label="Toggle sidebar">☰</button>
  <span class="font-semibold hidden sm:block">{{ shop.shop_name }}</span>
  <div class="flex-1"></div>

  <button id="dark-toggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800" aria-label="Toggle dark mode">
    <span class="dark:hidden">🌙</span><span class="hidden dark:inline">☀️</span>
  </button>

  <div class="relative" x-data="{ open: false }">
    <button @click="open = !open" class="flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800">
      <span class="w-7 h-7 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xs font-bold">
        {{ request.user.username|first|upper }}
      </span>
      <span class="hidden sm:block text-sm">{{ request.user.username }}
        <span class="text-xs text-gray-500">({{ request.user.profile.get_role_display }})</span>
      </span>
    </button>
    <div x-show="open" x-cloak @click.outside="open = false"
         class="absolute right-0 mt-1 w-44 card p-1 z-30">
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit" class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 text-sm">
          Log out
        </button>
      </form>
    </div>
  </div>
</header>
