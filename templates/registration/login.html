{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — {{ shop.shop_name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  {% include "partials/_tailwind_components.html" %}
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <div class="w-full max-w-sm card p-8">
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">📚</div>
      <h1 class="text-xl font-bold">{{ shop.shop_name }}</h1>
      <p class="text-sm text-gray-500">Sign in to continue</p>
    </div>
    {% if form.errors %}
    <div class="mb-4 px-4 py-2 rounded-lg bg-red-100 text-red-800 text-sm">
      Invalid username or password.
    </div>
    {% endif %}
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium mb-1" for="id_username">Username</label>
        <input type="text" name="username" id="id_username" required autofocus class="input">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="id_password">Password</label>
        <input type="password" name="password" id="id_password" required class="input">
      </div>
      <button type="submit" class="btn-primary w-full">Sign in</button>
    </form>
  </div>
</body>
</html>
