{% extends "base.html" %}
{% block title %}Return to supplier — {{ shop.shop_name }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto card p-6">
  <h1 class="text-xl font-bold mb-4">Return stock to supplier</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium mb-1">Supplier</label>
      <select name="supplier" class="input" required>
        {% for s in suppliers %}<option value="{{ s.pk }}">{{ s.name }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Product</label>
      <select name="product" class="input" required>
        {% for p in products %}
        <option value="{{ p.pk }}">{{ p.title }} (stock: {{ p.current_stock }}, cost: {{ p.cost_price }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium mb-1">Quantity</label>
        <input type="number" name="quantity" min="1" value="1" class="input" required>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Unit cost</label>
        <input type="number" name="unit_cost" step="0.01" min="0" class="input" required>
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Reason</label>
      <input type="text" name="reason" class="input">
    </div>
    <div class="flex gap-2">
      <button type="submit" class="btn-primary">Record return</button>
      <a href="{% url 'purchasing:po_list' %}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
